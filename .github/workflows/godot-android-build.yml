name: Godot Android export

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - feature/phase-003-character-pipeline
      - feature/phase-1-visual-benchmark
  push:
    branches:
      - main
      - 'feature/phase-1-*'

permissions:
  contents: read

# Serialize debug exports so the first run can seed the persistent debug keystore cache.
concurrency:
  group: owo-ta-android-debug-signing-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android-export:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # DEBUG-ONLY key. Pull-request jobs cannot restore this cache; never use for release signing.
      - name: Restore persistent debug signing key
        if: github.event_name != 'pull_request'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/owo-ta-debug-signing
          key: owo-ta-debug-signing-v1

      - name: Create debug signing key when cache is empty
        run: |
          mkdir -p "$RUNNER_TEMP/owo-ta-debug-signing"
          if [ ! -s "$RUNNER_TEMP/owo-ta-debug-signing/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$RUNNER_TEMP/owo-ta-debug-signing/debug.keystore" \
              -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=OWO TA Debug,O=Olori24,C=NG"
          fi
          test -s "$RUNNER_TEMP/owo-ta-debug-signing/debug.keystore"

      - name: Configure Godot debug keystore for this runner
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("export_presets.cfg")
          s = p.read_text()
          marker = '[preset.0.options]'
          before, after = s.split(marker, 1)
          lines = after.splitlines()
          values = {
              'keystore/debug_user': '"androiddebugkey"',
              'keystore/debug_password': '"android"',
          }
          # Use the actual runner-temp path supplied by the workflow environment.
          import os
          values['keystore/debug'] = '"' + os.environ['RUNNER_TEMP'] + '/owo-ta-debug-signing/debug.keystore"'
          replaced = set()
          output = []
          for line in lines:
              key = line.split('=', 1)[0] if '=' in line else ''
              if key in values:
                  output.append(key + '=' + values[key])
                  replaced.add(key)
              else:
                  output.append(line)
          for key, value in values.items():
              if key not in replaced:
                  output.append(key + '=' + value)
          p.write_text(before + marker + '\n'.join(output))
          PY

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download pinned Godot and export templates
        run: |
          mkdir -p .tools/export_templates "$HOME/.local/share/godot/export_templates/4.3.stable"
          curl --fail --location --retry 3 -o .tools/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q .tools/godot.zip -d .tools
          chmod +x .tools/Godot_v4.3-stable_linux.x86_64
          mv .tools/Godot_v4.3-stable_linux.x86_64 .tools/godot
          curl --fail --location --retry 3 -o .tools/export_templates.tpz https://github.com/godotengine/godot-builds/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          unzip -q .tools/export_templates.tpz -d .tools/export_templates
          cp -a .tools/export_templates/templates/. "$HOME/.local/share/godot/export_templates/4.3.stable/"

      - name: Install Android SDK command line tools
        run: |
          mkdir -p "$RUNNER_TEMP/android-sdk/cmdline-tools" "$RUNNER_TEMP/cmdline-tools-unpack"
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/cmdline-tools.zip" https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q "$RUNNER_TEMP/cmdline-tools.zip" -d "$RUNNER_TEMP/cmdline-tools-unpack"
          mv "$RUNNER_TEMP/cmdline-tools-unpack/cmdline-tools" "$RUNNER_TEMP/android-sdk/cmdline-tools/latest"
          echo "ANDROID_HOME=$RUNNER_TEMP/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$RUNNER_TEMP/android-sdk" >> "$GITHUB_ENV"

      - name: Install Android SDK packages and accept licenses
        run: |
          SDKMANAGER="$RUNNER_TEMP/android-sdk/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Export Android debug APK
        env:
          ANDROID_HOME: ${{ runner.temp }}/android-sdk
          ANDROID_SDK_ROOT: ${{ runner.temp }}/android-sdk
        run: |
          mkdir -p build/android
          ./.tools/godot --headless --path . --export-debug "Android Debug APK" build/android/owo_ta-debug.apk

      - name: Verify APK artifact
        run: |
          test -s build/android/owo_ta-debug.apk
          unzip -t build/android/owo_ta-debug.apk

      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs build/android/owo_ta-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: owo-ta-android-debug
          path: build/android/owo_ta-debug.apk
          if-no-files-found: error
