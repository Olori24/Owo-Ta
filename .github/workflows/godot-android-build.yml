name: Godot Android export

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  android-export:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download pinned Godot build
        run: |
          mkdir -p .tools
          curl -L -o .tools/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q .tools/godot.zip -d .tools
          chmod +x .tools/Godot_v4.3-stable_linux.x86_64
          mv .tools/Godot_v4.3-stable_linux.x86_64 .tools/godot

      - name: Install Android SDK command line tools
        run: |
          mkdir -p "$RUNNER_TEMP/android-sdk"
          curl -L -o "$RUNNER_TEMP/android-sdk/cmdline-tools.zip" https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q "$RUNNER_TEMP/android-sdk/cmdline-tools.zip" -d "$RUNNER_TEMP/android-sdk"
          mkdir -p "$RUNNER_TEMP/android-sdk/cmdline-tools/latest"
          mv "$RUNNER_TEMP/android-sdk/cmdline-tools"/* "$RUNNER_TEMP/android-sdk/cmdline-tools/latest/" 2>/dev/null || true
          echo "ANDROID_HOME=$RUNNER_TEMP/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$RUNNER_TEMP/android-sdk" >> "$GITHUB_ENV"

      - name: Accept Android SDK licenses
        run: |
          yes | "$RUNNER_TEMP/android-sdk/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Install Android build packages
        run: |
          "$RUNNER_TEMP/android-sdk/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-34" "build-tools;34.0.0" "cmdline-tools;latest" >/tmp/sdk-install.log

      - name: Export Android APK
        env:
          ANDROID_HOME: ${{ runner.temp }}/android-sdk
          ANDROID_SDK_ROOT: ${{ runner.temp }}/android-sdk
        run: |
          ./.tools/godot --headless --path . --export-debug "Android" build/android/owo_ta-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: owo-ta-android-debug
          path: build/android/owo_ta-debug.apk
