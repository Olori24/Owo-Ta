name: Godot project validation

on:
  push:
    branches:
      - main
      - develop
      - feature/phase-*
  pull_request:
    branches:
      - main
      - develop
      - feature/phase-*

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download pinned Godot build
        run: |
          mkdir -p .tools
          curl --fail --location --retry 3 -o .tools/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q .tools/godot.zip -d .tools
          chmod +x .tools/Godot_v4.3-stable_linux.x86_64
          mv .tools/Godot_v4.3-stable_linux.x86_64 .tools/godot

      - name: Import project resources
        run: ./.tools/godot --headless --editor --path . --quit

      - name: Validate configured main scene and gameplay components
        run: ./.tools/godot --headless --path . --script res://scripts/ProjectValidation.gd

      - name: Run gameplay behavior tests
        run: ./.tools/godot --headless --path . --script res://scripts/tests/GameplayFoundationTests.gd

      - name: Install software Vulkan and virtual-display prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends xvfb mesa-vulkan-drivers
          command -v xvfb-run
          find /usr/share/vulkan/icd.d -maxdepth 1 -type f -iname 'lvp_icd*.json' -print -quit | grep -q .

      - name: Render the configured district with Godot Forward Mobile
        env:
          OWO_RENDERED_SCENE_OUTPUT: ${{ github.workspace }}/build/verification/kemi-first-district.png
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          VULKAN_ICD="$(find /usr/share/vulkan/icd.d -maxdepth 1 -type f -iname 'lvp_icd*.json' -print -quit)"
          mkdir -p "$(dirname "$OWO_RENDERED_SCENE_OUTPUT")" "$RUNNER_TEMP/godot-runtime"
          chmod 700 "$RUNNER_TEMP/godot-runtime"
          xvfb-run -a -s "-screen 0 640x1024x24" env \
            XDG_RUNTIME_DIR="$RUNNER_TEMP/godot-runtime" \
            VK_ICD_FILENAMES="$VULKAN_ICD" \
            LIBGL_ALWAYS_SOFTWARE="$LIBGL_ALWAYS_SOFTWARE" \
            OWO_RENDERED_SCENE_OUTPUT="$OWO_RENDERED_SCENE_OUTPUT" \
            ./.tools/godot --path . --rendering-method mobile --rendering-driver vulkan \
              --windowed --resolution 540x960 --position 0,0 \
              --script res://scripts/tests/KemiRenderedSceneValidation.gd

      - name: Upload rendered Kemi district evidence
        uses: actions/upload-artifact@v4
        with:
          name: kemi-first-district-render
          path: build/verification/kemi-first-district.png
          if-no-files-found: error
          retention-days: 14

      - name: Validate original character asset and selection scene
        env:
          OWO_REQUIRE_IMPORTED_CHARACTER_SCENE: "1"
        run: ./.tools/godot --headless --path . --script res://scripts/tests/CharacterPipelineValidation.gd
      - name: Validate Phase 003B roster, character assets and animations
        run: ./.tools/godot --headless --path . --script res://scripts/tests/AdditionalCharacterRosterValidation.gd
